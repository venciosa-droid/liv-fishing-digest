<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIV Fishing &amp; Supply · Map dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0d1b26;color:#e8f1f7}
a{color:#8fd3ff}.top{background:#0b3d5c;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.top .brand{font-weight:700;font-size:16px;margin-right:auto}.top nav a{margin-left:10px;white-space:nowrap}
.status{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;background:#102a3a}
.pill{background:#18394d;border-radius:14px;padding:3px 10px;white-space:nowrap}.pill b{color:#fff}
.wrap{display:grid;grid-template-columns:1fr;gap:10px;padding:10px}.side{display:flex;flex-direction:column;gap:10px}
#map{height:62vh;min-height:340px;border-radius:10px}
.card{background:#132e40;border-radius:10px;padding:10px 12px}.card h2{font-size:15px;margin:0 0 8px}
.bar{display:flex;gap:8px;align-items:stretch;margin:5px 0;border-radius:6px;overflow:hidden;background:#0e2333}
.bar .d{min-width:84px;padding:6px;font-weight:600;color:#fff}.bar .v{padding:6px}.bar .x{font-size:12px;opacity:.8}
.t-good .d{background:#1f8a4c}.t-ok .d{background:#a88a12}.t-warn .d{background:#c2611b}.t-bad .d{background:#b3261e}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.day{background:#0e2333;border-radius:6px;padding:5px 3px;text-align:center;font-size:11px}
.day b{display:block;font-size:12px}.day .r{font-size:16px}.fn{font-size:12px;opacity:.75}
.lbl{background:none;border:none;box-shadow:none;color:#fff;font-weight:600;text-shadow:0 0 3px #000,0 0 3px #000;font-size:11px;padding:0}
.lbl:before{display:none}.legend{background:#132e40e6;color:#e8f1f7;padding:6px 8px;border-radius:8px;font-size:12px;line-height:1.5}
.leaflet-popup-content{font-size:13px;margin:10px 12px}.pop h3{margin:0 0 4px;font-size:15px}.pop td{padding:1px 6px 1px 0;vertical-align:top}
.ctl{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
@media(min-width:900px){.wrap{grid-template-columns:1.6fr 1fr}#map{height:calc(100vh - 140px)}.side{height:calc(100vh - 110px);overflow:auto}}
</style></head><body>
<div class="top"><span class="brand">🐠 LIV Fishing &amp; Supply</span><nav><a href="digest.html">Full report</a><a href="latest.png">Image</a><a href="archive/">Archive</a></nav></div>
<div class="status" id="status">Loading…</div>
<div class="wrap">
<div><div id="map"></div><div class="ctl"><label><input type="checkbox" id="arr" checked> Current arrows</label><label><input type="checkbox" id="lab" checked> Labels</label></div></div>
<div class="side"><div class="card"><h2>📦 Supply forecast</h2><div id="supply"></div><p class="fn" id="risk"></p></div>
<div class="card"><h2>🎣 Best fishing window</h2><div id="win"></div></div>
<div class="card"><h2>↪️ Turning point &amp; worst day</h2><div id="turn"></div></div>
<div class="card"><h2>📅 7-day (ECMWF wind/gust/rain)</h2><div class="days" id="days"></div></div>
<div class="card"><h2 id="chgT">What changed</h2><div id="chg"></div><p class="fn" id="src"></p></div>
</div></div>
<script>
const U='UNAVAILABLE',E=s=>String(s??U).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const COL={GOOD:'#22c55e',MARGINAL:'#eab308',POOR:'#f97316',BAD:'#dc2626'},EM={GOOD:'🟢',MARGINAL:'🟡',POOR:'🟠',BAD:'🔴'};
const DIR={N:0,NNE:22.5,NE:45,ENE:67.5,E:90,ESE:112.5,SE:135,SSE:157.5,S:180,SSW:202.5,SW:225,WSW:247.5,W:270,WNW:292.5,NW:315,NNW:337.5};
const v=(x,u='')=>x==null||x===''?U:x+u;
fetch('data.json?'+Date.now()).then(r=>r.json()).then(D=>{
 document.getElementById('status').innerHTML=[['🕑',D.reportTime],['Fishing',(EM[(D.overall||'').split(' ')[0]]||'')+' '+D.overall],['Limiter',D.limiter],['Confidence',D.confidence],['PAGASA',D.pagasa.status]].map(([k,x])=>`<span class="pill">${k}: <b>${E(x)}</b></span>`).join('');
 const map=L.map('map',{zoomSnap:.25});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'© OpenStreetMap contributors'}).addTo(map);
 const arrows=L.layerGroup().addTo(map),pts=[];
 D.areas.forEach(a=>{const c=COL[a.rating]||'#94a3b8';pts.push([a.lat,a.lng]);
  const m=L.circleMarker([a.lat,a.lng],{radius:10,color:'#fff',weight:2,fillColor:c,fillOpacity:.95}).addTo(map);
  m.bindTooltip(a.name,{permanent:true,direction:'right',offset:[10,0],className:'lbl'});
  const bw=a.bestWindow||{},rep=(bw.report||[]).map(E).join('<br>')||'See overall best window';
  m.bindPopup(`<div class="pop"><h3>${EM[a.rating]||'⚪'} ${E(a.name)} · ${E(a.rating)}</h3><table>
  <tr><td>🌊 Current</td><td><b>${v(a.current.kt,' kt')}</b> toward ${E(a.current.dir)} · ${E(a.current.status)}<br><span class="fn">24h range ${v(a.current.range24h,' kt')} · Open-Meteo Marine (not ECMWF)</span></td></tr>
  <tr><td>💨 Wind</td><td>${v(a.wind.kt,' kt')} ${E(a.wind.dir)}, gust ${v(a.wind.gustKt,' kt')} <span class="fn">ECMWF</span></td></tr>
  <tr><td>🌧️ Rain</td><td>${E(a.rain.intensity)} <span class="fn">ECMWF</span></td></tr>
  ${a.note?`<tr><td colspan=2 style="color:#b45309"><b>ⓘ ${E(a.note)}</b></td></tr>`:''}${a.ratingSource&&a.ratingSource!=='report'&&!a.note?'':''}<tr><td>🎣 Best</td><td>${rep}<br><span class="fn">Model best hour: ${E(bw.modelBestHour)}</span></td></tr></table></div>`,{maxWidth:300});
  if(a.current.kt!=null&&DIR[a.current.dir]!=null){const sz=14+a.current.kt*22;
   L.marker([a.lat,a.lng],{interactive:false,icon:L.divIcon({className:'',iconSize:[sz,sz],iconAnchor:[sz/2,sz/2],
   html:`<div style="width:${sz}px;height:${sz}px;transform:rotate(${DIR[a.current.dir]}deg) translateY(-${sz*0.75}px);color:#7dd3fc;font-size:${sz}px;line-height:${sz}px;text-align:center;text-shadow:0 0 2px #000">↑</div>`})}).addTo(arrows)}});
 const fit=()=>{map.invalidateSize();map.fitBounds(pts,{paddingTopLeft:[20,20],paddingBottomRight:[80,20]})};fit();setTimeout(fit,300);addEventListener('resize',fit);
 const lg=L.control({position:'bottomleft'});lg.onAdd=()=>{const d=L.DomUtil.create('div','legend');d.innerHTML='🟢 Good 🟡 Marginal<br>🟠 Poor 🔴 Bad<br><span style="color:#7dd3fc">↑</span> current toward (size = kt)';return d};lg.addTo(map);
 document.getElementById('arr').onchange=e=>e.target.checked?arrows.addTo(map):arrows.remove();
 document.getElementById('lab').onchange=e=>map.eachLayer(l=>l.getTooltip&&l.getTooltip()&&(e.target.checked?l.openTooltip():l.closeTooltip()));
 document.getElementById('supply').innerHTML=(D.supply.length?D.supply:[{label:'Supply',value:U,note:'',tone:'ok'}]).map(b=>`<div class="bar t-${b.tone}"><div class="d">${E(b.label)}</div><div class="v">${E(b.value)}<div class="x">${E(b.note)}</div></div></div>`).join('');
 document.getElementById('risk').textContent=D.shortageRisk;
 document.getElementById('win').innerHTML=`<b style="font-size:16px">${E(D.bestWindow.headline)}</b>`+D.bestWindow.details.map(p=>`<p>${E(p)}</p>`).join('');
 const t=D.turningPoint,w=D.worstDay;
 document.getElementById('turn').innerHTML=(t?`<p>Rating changes <b>${E(t.day)} ${E(t.date)}</b>: ${E(t.from)} → <b>${E(t.to)}</b></p>`:`<p>No rating change in the 7-day outlook.</p>`)+(w?`<p>Worst day: <b>${E(w.day)} ${E(w.date)}</b> · wind ${E(w.windKt)} kt, gust ${E(w.gustKt)} kt, ${E(w.rain)}</p>`:'')+'<p class="fn">From the ECMWF 7-day ratings.</p>';
 document.getElementById('days').innerHTML=D.sevenDay.map(d=>`<div class="day"><b>${E(d.day)}</b>${E((d.date||'').slice(8))}<div class="r">${EM[d.fishing]||'⚪'}</div>${v(d.windKt)}/${v(d.gustKt)} kt<br>${E((d.rain||U).replace(/^.*\((.*)\).*$/,'$1'))}</div>`).join('');
 document.getElementById('chgT').textContent=D.changed.title;
 document.getElementById('chg').innerHTML=D.changed.items.map(p=>`<p>${E(p)}</p>`).join('')||U;
 document.getElementById('src').innerHTML=`${E(D.pagasa.detail)}<br>Wind/rain: ECMWF via Open-Meteo · Currents: Open-Meteo Marine (not ECMWF) · <a href="${D.links.zoomSatellite}">Zoom Earth satellite</a>`;
}).catch(e=>{document.getElementById('status').textContent='Data UNAVAILABLE ('+e+')'});
</script></body></html>
