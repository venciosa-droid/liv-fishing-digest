<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIV 7-day local fresh fish plan</title>
<style>
:root{
  --ink:#124a9a;
  --good:#0b6b2b;
  --good-bg:#e5f6ea;
  --caut:#8a5a00;
  --caut-bg:#fff3bf;
  --warn:#b00000;
  --warn-bg:#fde4e4;
  --na:#555;
  --line:#c5d4ea;
  --paper:#fff;
}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
html,body{margin:0;padding:0;background:#eef3fa;color:var(--ink);font:18px/1.45 "Segoe UI",system-ui,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px 18px 36px;background:var(--paper)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end;margin:0 0 14px}
.toolbar button{font:700 18px/1.2 system-ui,sans-serif;color:#fff;background:var(--ink);border:0;border-radius:8px;padding:12px 16px;min-height:48px;cursor:pointer}
.toolbar button.print{background:var(--good)}
.toolbar button:disabled{opacity:.6;cursor:wait}
h1{font:700 32px/1.2 system-ui,sans-serif;margin:0 0 6px;color:var(--ink)}
.sub{margin:0 0 4px;font-size:18px}
.updated{margin:0 0 12px;font-weight:700;font-size:18px}
.err{color:var(--warn);font-weight:700;margin:0 0 12px}
.key{display:flex;flex-wrap:wrap;gap:8px 16px;margin:0 0 16px;padding:10px 12px;border:2px solid var(--line);border-radius:8px;font-size:18px}
.key b{font-weight:700;padding:2px 8px;border-radius:4px}
.key .g{color:var(--good);background:var(--good-bg)}
.key .c{color:var(--caut);background:var(--caut-bg)}
.key .w{color:var(--warn);background:var(--warn-bg)}
.key .b{color:var(--ink)}
.sum{border:2px solid var(--line);border-radius:8px;padding:14px 16px;margin:0 0 20px}
.sum p{margin:0 0 10px}
.sum p:last-child{margin:0}
.sum b.label{display:inline-block;min-width:5.5em}
h2{font:700 26px/1.2 system-ui,sans-serif;margin:22px 0 10px;color:var(--ink)}
h2 .place{display:block;font-weight:500;font-size:18px;margin-top:2px}
h2.coron{font-size:22px;margin-top:28px}
.dchip{white-space:nowrap}
.dchip .md{display:block;font-weight:700;font-size:18px}
.dchip .wk{display:block;font-weight:500;font-size:16px}
.days{display:flex;flex-direction:column;gap:12px}
.day{display:grid;grid-template-columns:8.2em 1fr;grid-template-rows:auto auto auto;column-gap:16px;row-gap:2px;padding:14px 16px;border:2px solid var(--line);border-left-width:10px;border-radius:10px;break-inside:avoid;page-break-inside:avoid}
.day.good{border-left-color:var(--good);background:#f7fbf8}
.day.caut{border-left-color:var(--caut);background:#fffdf3}
.day.warn{border-left-color:var(--warn);background:#fff8f8}
.day.na{border-left-color:var(--na);background:#f5f5f5}
.day .when{grid-row:1/4;align-self:center}
.day .md{display:block;font-weight:700;font-size:24px;line-height:1.15;color:var(--ink)}
.day .wk{display:block;font-weight:500;font-size:18px;margin-top:2px}
.day .verdict{grid-column:2;font:700 28px/1.1 system-ui,sans-serif;letter-spacing:.02em}
.day .verdict.good,.facts .good{color:var(--good)}
.day .verdict.caut,.facts .caut{color:var(--caut)}
.day .verdict.warn,.facts .warn{color:var(--warn)}
.day .verdict.na,.facts .na,.na{color:var(--na);font-weight:700}
.day .facts{grid-column:2;font-size:20px;font-weight:600;display:flex;flex-wrap:wrap;gap:6px 22px}
.day .why{grid-column:2;margin:4px 0 0;font-size:18px;font-weight:500}
span.warn{color:var(--warn);background:var(--warn-bg);font-weight:700;padding:0 4px;border-radius:3px}
.days-mini .day{grid-template-rows:auto auto;padding:10px 12px;border-left-width:8px}
.days-mini .when{grid-row:1/3}
.days-mini .md{font-size:20px}
.days-mini .wk{font-size:18px}
.days-mini .verdict{font-size:22px}
.days-mini .facts{font-size:18px}
.notes{margin:18px 0 0;font-size:18px}
.notes p{margin:0}
.status{margin:10px 0 0;font-size:18px}
@media screen and (max-width:600px){
  .wrap{padding:12px}
  h1{font-size:28px}
  h2{font-size:24px}
  .day{grid-template-columns:1fr;grid-template-rows:auto}
  .day .when,.day .verdict,.day .facts,.day .why{grid-column:1;grid-row:auto}
  .day .when{margin-bottom:4px}
  .toolbar button{width:100%}
}
@media print{
  @page{size:A4 portrait;margin:10mm}
  html,body{background:#fff;font-size:12pt;line-height:1.35}
  .wrap{max-width:none;padding:0;margin:0}
  .toolbar{display:none!important}
  h1{font-size:20pt;margin:0 0 4px}
  h2{font-size:16pt;margin:10px 0 6px;break-after:avoid;page-break-after:avoid}
  h2.coron{font-size:14pt;break-before:page;page-break-before:always}
  h2 .place{font-size:11pt}
  .sub,.updated,.key,.notes,.sum p,.day .wk,.day .why,.days-mini .facts{font-size:11pt}
  .key{margin:0 0 8px;padding:6px 8px}
  .sum{margin:0 0 8px;padding:8px 10px}
  .dchip .md{font-size:11pt}
  .dchip .wk{font-size:10pt}
  .days{gap:6px}
  .day{padding:7px 10px;column-gap:12px;border-radius:6px}
  .day .md{font-size:14pt}
  .day .verdict{font-size:16pt}
  .day .facts{font-size:12pt}
  .days-mini .day{padding:5px 8px}
  .days-mini .md{font-size:12pt}
  .days-mini .verdict{font-size:13pt}
  .notes{margin:8px 0 0}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="toolbar no-print">
    <div class="links">
      <button type="button" id="rf">Refresh forecast</button>
      <button type="button" class="print" id="print">Print</button>
    </div>
  </div>
  <h1>LIV 7-day fresh fish plan</h1>
  <p class="sub" id="range">Next 7 days from today, Philippines time (PHT)</p>
  <p class="updated" id="updated">Updated: loading…</p>
  <p class="err" id="err" hidden></p>
  <div class="key" aria-label="Color key">
    <span><b class="g">Green</b> GOOD</span>
    <span><b class="c">Yellow</b> CAUTION</span>
    <span><b class="w">Red</b> WARNING</span>
    <span><b class="b">Blue</b> general information</span>
  </div>
  <section class="sum" id="sum"><p>Loading the 7-day plan…</p></section>
  <h2 id="h-galoc">Galoc Station <span class="place">Use this first</span></h2>
  <div id="galoc"></div>
  <h2 class="coron" id="h-coron">Coron <span class="place">Second choice</span></h2>
  <div id="coron"></div>
  <div class="notes" id="notes"></div>
  <p class="status" id="status"></p>
</div>
<script>
const TZ='Asia/Manila',DATA_URL='fresh7.json',STORE_KEY='livFresh7V1',FRESH_MS=12*60*60e3;
const KT_TO_KPH=1.852,KMH_TO_KT=0.539957,WIND_BAD_KPH=18;
const COMPASS=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
const RANK={NONE:0,LIGHT:1,FAVORABLE:0,GOOD:0,MODERATE:2,MARGINAL:2,STRONG:3,POOR:3,HEAVY:3,'VERY STRONG':4,'VERY POOR':4,UNAVAILABLE:1};
const AREA_META={
  galoc:{id:'galoc',name:'Galoc Station',place:'Galoc Island, Culion, Palawan',lat:11.966933,lng:119.845707},
  coron:{id:'coron',name:'Coron',place:'Coron, Palawan',lat:11.9988,lng:120.206}
};
function $(id){return document.getElementById(id)}
function num(x){if(x==null||x==='')return null;const f=Number(x);return Number.isFinite(f)?f:null}
function r1(x){return x==null?null:Math.round(x*10)/10}
function kph(kt){const k=num(kt);return k==null?null:Math.round(k*KT_TO_KPH)}
function compass(d){d=num(d);return d==null?null:COMPASS[Math.floor((d+11.25)/22.5)%16]}
function curClass(k){if(k==null)return 'UNAVAILABLE';if(k<0.5)return 'Favorable';if(k<0.9)return 'Moderate';if(k<1.5)return 'Strong';return 'Very Strong'}
function windClass(kt){if(kt==null)return 'UNAVAILABLE';if(kt<=10)return 'Good';if(kt<=15)return 'Marginal';if(kt<=20)return 'Poor';return 'Very Poor'}
function rainClass(mm3){if(mm3==null)return 'UNAVAILABLE';if(mm3<1)return 'Light';if(mm3<=5)return 'Moderate';return 'Heavy'}
function rankOf(label){return RANK[String(label).toUpperCase()]??2}
function fishing(c,w,r){if([c,w,r].some(x=>x==null||String(x).toUpperCase()==='UNAVAILABLE'))return 'UNAVAILABLE';const x=Math.max(rankOf(c),rankOf(w),rankOf(r));return x<=1?'GOOD':x===2?'MARGINAL':x===3?'POOR':'VERY POOR'}
function seaRating(c,w){if([c,w].some(x=>x==null||String(x).toUpperCase()==='UNAVAILABLE'))return 'UNAVAILABLE';const x=Math.max(rankOf(c),rankOf(w));return x<=1?'GOOD':x===2?'MARGINAL':x===3?'POOR':'VERY POOR'}
function rain3(precip,i){if(i<2)return null;const a=num(precip[i-2]),b=num(precip[i-1]),c=num(precip[i]);return a==null||b==null||c==null?null:a+b+c}
function phtYmd(ms){return new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(ms))}
function addDays(ymd,n){return phtYmd(Date.parse(ymd+'T12:00:00+08:00')+n*86400e3)}
function planDays(now){const t0=phtYmd(now),out=[];for(let i=0;i<7;i++)out.push(addDays(t0,i));return out}
function isFresh(at,now,windowMs){if(at==null||!Number.isFinite(+at))return false;const age=(now-+at);return age<(windowMs??FRESH_MS)&&age>=-60e3}
function weekday(ymd){return new Intl.DateTimeFormat('en-US',{timeZone:TZ,weekday:'short'}).format(Date.parse(ymd+'T12:00:00+08:00'))}
function weekdayLong(ymd){return new Intl.DateTimeFormat('en-US',{timeZone:TZ,weekday:'long'}).format(Date.parse(ymd+'T12:00:00+08:00'))}
function mdLabel(ymd){const d=new Date(ymd+'T12:00:00+08:00');const m=new Intl.DateTimeFormat('en-US',{timeZone:TZ,month:'short'}).format(d);const day=new Intl.DateTimeFormat('en-US',{timeZone:TZ,day:'numeric'}).format(d);return m+' '+day}
function dayLabel(ymd){return mdLabel(ymd)+' '+weekdayLong(ymd)}
function rangeLabel(days){if(!days.length)return '';const a=new Date(days[0]+'T12:00:00+08:00'),b=new Date(days[days.length-1]+'T12:00:00+08:00');const fmt=d=>new Intl.DateTimeFormat('en-GB',{timeZone:TZ,weekday:'short',day:'numeric',month:'short',year:'numeric'}).format(d);return fmt(a)+' – '+fmt(b)}
function hourLabel(h){h=Number(h);if(h===0||h===24)return '12 AM';if(h===12)return '12 PM';return (h%12)+' '+(h<12?'AM':'PM')}
function nightSpan(hours){if(!hours||!hours.length)return 'UNAVAILABLE';const a=hours[0].hour,b=(hours[hours.length-1].hour+1)%24;return hourLabel(a)+'–'+hourLabel(b||24)}
function fmtPht(ms){if(ms==null||!Number.isFinite(+ms))return 'UNAVAILABLE';const d=new Date(+ms);const date=new Intl.DateTimeFormat('en-GB',{timeZone:TZ,weekday:'short',day:'numeric',month:'short',year:'numeric'}).format(d).replace(',','');const time=new Intl.DateTimeFormat('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit',hour12:true}).format(d);return date+', '+time+' PHT'}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function buildHours(payload){
  const e=payload.ecmwf||{},m=payload.marine||{};
  const eh=e.hourly||{},mh=m.hourly||{};
  const times=eh.time||[];
  const mt={};(mh.time||[]).forEach((t,i)=>{mt[t]=i});
  const unit=String((m.hourly_units||{}).ocean_current_velocity||'km/h').toLowerCase();
  const ws=eh.wind_speed_10m||[],wg=eh.wind_gusts_10m||[],wd=eh.wind_direction_10m||[],pr=eh.precipitation||[];
  const cvA=mh.ocean_current_velocity||[],cdA=mh.ocean_current_direction||[];
  const out=[];
  for(let i=0;i<times.length;i++){
    const t=times[i],wk=num(ws[i]),gk=num(wg[i]),dir=num(wd[i]),mm=num(pr[i]),r3=rain3(pr,i);
    const j=mt[t];
    let ck=null,cd=null;
    if(j!=null){
      const cv=num(cvA[j]);
      if(cv!=null) ck=(unit==='kn'||unit==='kt'||unit==='knots')?cv:cv*KMH_TO_KT;
      cd=num(cdA[j]);
    }
    const cc=curClass(ck),wc=windClass(wk),rc=rainClass(r3);
    out.push({time:t,day:t.slice(0,10),hour:+t.slice(11,13),wk,w_kph:kph(wk),g_kph:kph(gk),dir:compass(dir),ck:r1(ck),cdir:compass(cd),cc,mm:r1(mm),r3:r1(r3),rating:fishing(cc,wc,rc),sea:seaRating(cc,wc)});
  }
  return out;
}
function gfsDailyMax(payload,day){
  const gh=(payload.gfs||{}).hourly||{};
  const times=gh.time||[],speeds=gh.wind_speed_10m||[],gusts=gh.wind_gusts_10m||[];
  const wks=[],gks=[];
  for(let i=0;i<times.length;i++){
    if(times[i].slice(0,10)!==day)continue;
    const w=kph(speeds[i]),g=kph(gusts[i]);
    if(w!=null)wks.push(w);
    if(g!=null)gks.push(g);
  }
  if(!wks.length)return [null,null];
  return [Math.max(...wks),gks.length?Math.max(...gks):null];
}
function trip(hours,startDay){
  const nxt=addDays(startDay,1);
  return hours.filter(h=>(h.day===startDay&&h.hour>=18)||(h.day===nxt&&h.hour<6));
}
function runsWhere(hours,pred){
  const out=[];let cur=[];
  for(const h of hours){if(pred(h))cur.push(h);else if(cur.length){out.push(cur);cur=[]}}
  if(cur.length)out.push(cur);
  return out;
}
function iceAndCatch(windows){
  const usable=windows.flat().filter(h=>h.sea!=='UNAVAILABLE');
  if(usable.length<6)return {ice:'UNAVAILABLE',ice_key:'na',catch:'UNAVAILABLE',supply:'UNAVAILABLE',G:0,M:0,usable:usable.length};
  const G=usable.filter(h=>h.sea==='GOOD').length,M=usable.filter(h=>h.sea==='MARGINAL').length;
  let ice,ice_key;
  if(G>=6){ice='Full';ice_key='full'}
  else if(G>=2||M>=6||(G+M)>=6){ice='Some';ice_key='some'}
  else {ice='Little';ice_key='little'}
  let catchv;
  if(G>=10)catchv='High';
  else if(G>=6||(G>=4&&G+M>=12))catchv='Normal';
  else if(G>=2||G+M>=6)catchv='Light';
  else catchv='Very light';
  const supply={High:'Supply',Normal:'Supply',Light:'Limited','Very light':'Hold'}[catchv];
  return {ice,ice_key,catch:catchv,supply,G,M,usable:usable.length};
}
function windPhrase(hours,under18IfTrue=true){
  const wks=hours.map(h=>h.w_kph).filter(v=>v!=null);
  if(!wks.length)return 'wind UNAVAILABLE';
  const lo=Math.min(...wks),hi=Math.max(...wks);
  if(under18IfTrue&&hi<=WIND_BAD_KPH)return 'wind under 18 kph';
  if(lo===hi)return 'wind '+hi+' kph';
  return 'wind '+lo+'–'+hi+' kph';
}
function tripStartDay(tripHours){
  if(!tripHours.length)return null;
  const h0=tripHours[0];
  return h0.hour>=18?h0.day:addDays(h0.day,-1);
}
function describeTrip(tripHours){
  if(!tripHours.length)return 'UNAVAILABLE';
  const usable=tripHours.filter(h=>h.rating!=='UNAVAILABLE');
  if(usable.length<6)return 'UNAVAILABLE';
  const start=tripStartDay(tripHours);
  const dayword=start?weekday(start):'';
  const good=runsWhere(tripHours,h=>h.rating==='GOOD');
  const over=tripHours.filter(h=>h.w_kph!=null&&h.w_kph>WIND_BAD_KPH);
  if(good.length===1&&good[0].length===usable.length)return (dayword+' '+nightSpan(good[0])+', '+windPhrase(good[0])).trim();
  if(good.length){
    const parts=good.map(nightSpan).join(', ');
    const extra=over.length?'; after midnight wind above 18 kph':'';
    return (dayword+' good '+parts+', '+windPhrase(good.flat())+extra).trim();
  }
  const marg=runsWhere(tripHours,h=>h.rating==='MARGINAL');
  if(marg.length)return (dayword+' marginal '+marg.map(nightSpan).join(', ')+', '+windPhrase(marg.flat(),false)).trim();
  return (dayword+' rough, '+windPhrase(usable,false)).trim();
}
function goOutText(amTrip,pmTrip){
  const early=describeTrip(amTrip),night=describeTrip(pmTrip);
  const isFullGood=(text,tr)=>tr&&tr.length&&tr.every(h=>h.rating==='UNAVAILABLE'||h.rating==='GOOD')&&text.includes('6 PM–6 AM');
  if(isFullGood(early,amTrip)&&isFullGood(night,pmTrip))return '6 PM–6 AM, '+windPhrase(amTrip.concat(pmTrip));
  const short=s=>s.replace('wind under 18 kph','under 18 kph').replace('wind above 18 kph','above 18 kph');
  return 'AM: '+short(early)+'. PM: '+short(night)+'.';
}
function fishingTone(amTrip,pmTrip){
  const hours=amTrip.concat(pmTrip).filter(h=>h.rating!=='UNAVAILABLE');
  if(hours.length<6)return 'UNAVAILABLE';
  const counts={};for(const h of hours)counts[h.rating]=(counts[h.rating]||0)+1;
  if(counts['VERY POOR']||counts.POOR){
    if((counts.GOOD||0)>=12)return 'GOOD / '+(counts.POOR?'POOR':'VERY POOR');
    return counts.POOR&&!counts['VERY POOR']?'POOR':'VERY POOR';
  }
  if(counts.MARGINAL&&counts.GOOD){
    if(counts.MARGINAL<=4&&counts.GOOD>=16)return 'GOOD';
    return 'GOOD / MARGINAL';
  }
  if(counts.MARGINAL&&!counts.GOOD)return 'MARGINAL';
  return 'GOOD';
}
function modal(arr){if(!arr.length)return '';const c={};for(const x of arr)c[x]=(c[x]||0)+1;return Object.entries(c).sort((a,b)=>b[1]-a[1])[0][0]}
function calendarStats(hours,day){
  const dayh=hours.filter(h=>h.day===day);
  const wks=dayh.map(h=>h.w_kph).filter(v=>v!=null);
  const gks=dayh.map(h=>h.g_kph).filter(v=>v!=null);
  const dirs=dayh.map(h=>h.dir).filter(Boolean);
  const cks=dayh.map(h=>h.ck).filter(v=>v!=null);
  const cdirs=dayh.map(h=>h.cdir).filter(Boolean);
  const mms=dayh.map(h=>h.mm).filter(v=>v!=null);
  const missingW=dayh.length<24||dayh.some(h=>h.w_kph==null);
  const missingC=dayh.length<24||dayh.some(h=>h.ck==null);
  const missingR=dayh.length<24||dayh.some(h=>h.mm==null);
  let wind='UNAVAILABLE',windMax=null,windOver=false;
  if(wks.length){
    const avg=Math.round(wks.reduce((a,b)=>a+b,0)/wks.length);
    const mx=Math.max(...wks);windMax=mx;windOver=mx>WIND_BAD_KPH;
    const d=modal(dirs);
    const maxH=dayh.filter(h=>h.w_kph!=null).sort((a,b)=>b.w_kph-a.w_kph)[0];
    const md=(maxH&&maxH.dir)||d;
    const gust=gks.length?Math.max(...gks):null;
    const gustS=gust!=null?' g'+gust:'';
    wind=(d&&md&&d!==md)?`${d} ${avg} avg · max ${md} ${mx}${gustS}`:`${d} ${avg} avg · max ${mx}${gustS}`.trim();
    if(missingW)wind+=' (some hours UNAVAILABLE)';
  }
  let current='UNAVAILABLE';
  if(cks.length){
    const lo=Math.min(...cks),hi=Math.max(...cks);
    const cd=modal(cdirs);
    const rng=lo===hi?lo.toFixed(1)+' kt':lo.toFixed(1)+'–'+hi.toFixed(1)+' kt';
    current=(cd+' '+rng).trim();
    if(missingC)current+=' (some hours UNAVAILABLE)';
  }
  let rain='UNAVAILABLE';
  if(mms.length&&!missingR){const total=r1(mms.reduce((a,b)=>a+b,0));rain=total===0?'Dry':total.toFixed(1)+' mm'}
  else if(mms.length){const total=r1(mms.reduce((a,b)=>a+b,0));rain=(total===0?'Dry':total.toFixed(1)+' mm')+' (incomplete)'}
  return {wind,current,rain,windMax,windOver};
}
function confidence(day,now){const start=Date.parse(day+'T00:00:00+08:00');return start<=now+48*3600e3?'High':'Lower'}
function gfsAgree(emax,gmax){
  if(emax==null||gmax==null)return 'UNAVAILABLE';
  const diff=Math.abs(gmax-emax);
  if(diff<=4)return 'Agrees';
  if(gmax>emax+4)return 'GFS windier ('+gmax+' vs '+emax+' kph)';
  return 'GFS lighter ('+gmax+' vs '+emax+' kph)';
}
function buildRows(payload,days,now){
  const hours=buildHours(payload);
  return days.map(day=>{
    const am=trip(hours,addDays(day,-1)),pm=trip(hours,day),lag1=trip(hours,addDays(day,-2));
    const landing=iceAndCatch([lag1,am]);
    const stats=calendarStats(hours,day);
    const [gmax]=gfsDailyMax(payload,day);
    const dayh=hours.filter(h=>h.day===day);
    const emax=dayh.reduce((m,h)=>h.w_kph==null?m:m==null?h.w_kph:Math.max(m,h.w_kph),null);
    const goWinds=am.concat(pm).map(h=>h.w_kph).filter(v=>v!=null);
    const goOver=goWinds.some(v=>v>WIND_BAD_KPH);
    return {day,label:dayLabel(day),md:mdLabel(day),wk:weekdayLong(day),weekday:weekday(day),wind:stats.wind,current:stats.current,rain:stats.rain,windMax:stats.windMax,windOver:stats.windOver,goOver,fishing:fishingTone(am,pm),goout:goOutText(am,pm),catch:landing.catch,ice:landing.ice,ice_key:landing.ice_key,supply:landing.supply,G:landing.G,M:landing.M,conf:confidence(day,now),gfs:gfsAgree(emax,gmax),ecmwf_max:emax,gfs_max:gmax};
  });
}
function toneClass(fishing){
  const f=String(fishing).toUpperCase();
  if(f.includes('UNAVAILABLE'))return 'na';
  if(f.includes('VERY POOR')||f==='POOR'||f.includes('/ POOR'))return 'warn';
  if(f.includes('MARGINAL'))return 'caut';
  if(f.includes('GOOD'))return 'good';
  return 'na';
}
function plainVerdict(r){
  const f=String((r&&r.fishing)||'').toUpperCase();
  if(f.includes('UNAVAILABLE')||!f)return 'UNAVAILABLE';
  if(f.includes('VERY POOR')||f==='POOR'||f.includes('/ POOR')||f.includes('/ VERY POOR'))return 'WARNING';
  if(f.includes('MARGINAL')||(r&&r.goOver))return 'CAUTION';
  if(f.includes('GOOD'))return 'GOOD';
  return 'UNAVAILABLE';
}
function iceWords(ice){return {Full:'Yes',Some:'Ready less',Little:'No',UNAVAILABLE:'UNAVAILABLE'}[ice]||'UNAVAILABLE'}
function supplyWords(s){return {Supply:'Yes',Limited:'Ready less',Hold:'No',UNAVAILABLE:'UNAVAILABLE'}[s]||'UNAVAILABLE'}
function wordClass(word){return {Yes:'good','Ready less':'caut',No:'warn',UNAVAILABLE:'na',GOOD:'good',CAUTION:'caut',WARNING:'warn'}[word]||'na'}
function paintWhy(s){
  return esc(s)
    .replace(/above 18 kph/g,'<span class="warn">above 18 kph</span>')
    .replace(/UNAVAILABLE/g,'<span class="na">UNAVAILABLE</span>');
}
function shortReason(r){
  if(!r)return 'UNAVAILABLE';
  if(r.fishing==='UNAVAILABLE'||r.goout==='UNAVAILABLE')return 'Forecast UNAVAILABLE';
  const go=String(r.goout||'');
  if(r.goOver||/above 18/.test(go)){
    if(/after midnight/.test(go))return 'Wind above 18 kph after midnight';
    return 'Wind above 18 kph at night';
  }
  if(/under 18/.test(go)||/6 PM–6 AM/.test(go))return 'Wind under 18 kph at night';
  if(/rough/i.test(go)){
    const m=go.match(/wind \d+(–\d+)? kph/);
    return m?'Rough night, '+m[0]:'Rough night';
  }
  if(/marginal/i.test(go))return 'Rougher wind at night';
  return '';
}
function dayChip(r){
  if(!r)return '';
  const md=r.md||mdLabel(r.day),wk=r.wk||weekdayLong(r.day);
  return `<span class="dchip"><b>${esc(md)}</b> ${esc(wk)}</span>`;
}
function listDays(rows){
  if(!rows.length)return 'none';
  if(rows.length===1)return dayChip(rows[0]);
  return rows.slice(0,-1).map(dayChip).join(' ')+' and '+dayChip(rows[rows.length-1]);
}
function rangeChips(rows){
  if(!rows.length)return '';
  if(rows.length===1)return dayChip(rows[0]);
  return dayChip(rows[0])+' to '+dayChip(rows[rows.length-1]);
}
function prose(galoc){
  const best=galoc.filter(r=>plainVerdict(r)==='GOOD'&&supplyWords(r.supply)==='Yes');
  const careful=galoc.filter(r=>{const v=plainVerdict(r);return v==='CAUTION'||v==='WARNING'});
  const iceYes=galoc.length&&galoc.every(r=>iceWords(r.ice)==='Yes');
  const iceNo=galoc.filter(r=>iceWords(r.ice)==='No'||iceWords(r.ice)==='Ready less'||iceWords(r.ice)==='UNAVAILABLE');
  let bestS;
  if(!best.length)bestS='No clearly good supply days this week.';
  else if(best.length===7)bestS='All 7 days look good.';
  else bestS=listDays(best)+'.';
  let cutS;
  if(careful.length)cutS=listDays(careful)+'.';
  else cutS='No days need a cut-back this week.';
  let iceS;
  if(iceYes)iceS='Yes every day, '+rangeChips(galoc)+'.';
  else if(!iceNo.length)iceS='UNAVAILABLE';
  else iceS=galoc.map(r=>dayChip(r)+' '+iceWords(r.ice)).join('; ')+'.';
  return {bestS,cutS,iceS};
}
function dayCard(r,compact){
  const v=plainVerdict(r);
  const ice=iceWords(r.ice),sup=supplyWords(r.supply);
  const why=compact?'':shortReason(r);
  const reason=why?`<p class="why">${paintWhy(why)}</p>`:'';
  return `<article class="day ${wordClass(v)}${compact?' mini':''}">
    <div class="when"><span class="md">${esc(r.md||mdLabel(r.day))}</span><span class="wk">${esc(r.wk||weekdayLong(r.day))}</span></div>
    <div class="verdict ${wordClass(v)}">${esc(v)}</div>
    <div class="facts"><span class="${wordClass(ice)}">Ice: ${esc(ice)}</span><span class="${wordClass(sup)}">Supply: ${esc(sup)}</span></div>
    ${reason}
  </article>`;
}
function daysHtml(rows,compact){
  if(!rows||!rows.length)return '<p>UNAVAILABLE</p>';
  return `<div class="days${compact?' days-mini':''}">${rows.map(r=>dayCard(r,!!compact)).join('')}</div>`;
}
function hasAreaData(area){return !!((((area||{}).ecmwf||{}).hourly||{}).time||[]).length}
function render(payload,now){
  now=now??Date.now();
  const days=planDays(now);
  const at=payload&&payload.at;
  const source=payload&&payload.source;
  const areas=(payload&&payload.areas)||{};
  const galocPayload=areas.galoc||{};
  const coronPayload=areas.coron||{};
  const galoc=hasAreaData(galocPayload)?buildRows(galocPayload,days,at||now):[];
  const coron=hasAreaData(coronPayload)?buildRows(coronPayload,days,at||now):[];
  const range=rangeLabel(days);
  $('range').textContent=range+' · the next 7 days, Philippines time (PHT)';
  const srcBit=source==='live'?' (live forecast)':source==='publish'?'':'';
  $('updated').textContent='Updated: '+fmtPht(at)+srcBit;
  document.title='LIV 7-day fresh fish plan · '+range;
  if(!galoc.length){
    $('sum').innerHTML='<p class="err">Galoc forecast UNAVAILABLE. No values were invented.</p>';
    $('galoc').innerHTML='<p>UNAVAILABLE</p>';
    $('coron').innerHTML=coron.length?daysHtml(coron,true):'<p>UNAVAILABLE</p>';
    return {days,galoc,coron};
  }
  const p=prose(galoc);
  $('sum').innerHTML=`<p><b class="label good">Good days:</b> ${p.bestS}</p>
    <p><b class="label caut">Be careful:</b> ${p.cutS}</p>
    <p><b class="label good">Ice:</b> ${p.iceS}</p>`;
  $('galoc').innerHTML=daysHtml(galoc,false);
  $('coron').innerHTML=coron.length?daysHtml(coron,true):'<p>UNAVAILABLE</p>';
  const lastHigh=galoc.filter(r=>r.conf==='High').slice(-1)[0];
  const far=lastHigh?'Days after '+esc(lastHigh.md)+' '+esc(lastHigh.wk)+' are farther ahead and may still change. ':'';
  $('notes').innerHTML=`<p>${far}Wind is in kph. If something is missing, it says UNAVAILABLE — no values were invented. The plan updates about 6:20 AM and 2:20 PM, and by itself if it is more than 12 hours old.</p>`;
  return {days,galoc,coron};
}
function apiUrl(kind,lat,lng){
  const common='latitude='+lat+'&longitude='+lng+'&timezone=Asia%2FManila&forecast_days=10&past_days=3';
  if(kind==='marine')return 'https://marine-api.open-meteo.com/v1/marine?'+common+'&hourly=ocean_current_velocity,ocean_current_direction';
  const wind='&hourly=wind_speed_10m,wind_direction_10m,wind_gusts_10m,precipitation&wind_speed_unit=kn&precipitation_unit=mm&cell_selection=sea';
  const host='https://api.open-meteo.com/v1/'+(kind==='gfs'?'gfs':'ecmwf');
  return host+'?'+common+wind;
}
async function fetchJson(url){
  const r=await fetch(url,{cache:'no-cache'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.json();
}
function slimArea(id,meta,ecmwf,marine,gfs){
  return Object.assign({},meta,{id,ecmwf:ecmwf||{hourly:{}},marine:marine||{hourly:{}},gfs:gfs||{hourly:{}}});
}
async function fetchAreaLive(meta){
  const [e,m,g]=await Promise.allSettled([
    fetchJson(apiUrl('ecmwf',meta.lat,meta.lng)),
    fetchJson(apiUrl('marine',meta.lat,meta.lng)),
    fetchJson(apiUrl('gfs',meta.lat,meta.lng))
  ]);
  const ecmwf=e.status==='fulfilled'?e.value:null;
  const marine=m.status==='fulfilled'?m.value:null;
  const gfs=g.status==='fulfilled'?g.value:null;
  if(!ecmwf||!((ecmwf.hourly||{}).time||[]).length)throw new Error((meta.name||meta.id)+' ECMWF UNAVAILABLE');
  return slimArea(meta.id,meta,ecmwf,marine,gfs);
}
async function fetchLive(){
  const galoc=await fetchAreaLive(AREA_META.galoc);
  let coron=null;
  try{coron=await fetchAreaLive(AREA_META.coron)}catch(e){coron=slimArea('coron',AREA_META.coron,null,null,null)}
  return {at:Date.now(),source:'live',tz:TZ,areas:{galoc,coron}};
}
function readStore(){
  try{return JSON.parse(localStorage.getItem(STORE_KEY)||'null')}catch(e){return null}
}
function writeStore(data){
  try{localStorage.setItem(STORE_KEY,JSON.stringify(data))}catch(e){}
}
function newer(a,b){
  const at=a&&Number.isFinite(+a.at)?+a.at:-1,bt=b&&Number.isFinite(+b.at)?+b.at:-1;
  if(at<0&&bt<0)return null;
  return at>=bt?a:b;
}
async function loadFile(){
  try{return await fetchJson(DATA_URL)}catch(e){return null}
}
function setErr(msg){const el=$('err');if(!el)return;if(!msg){el.hidden=true;el.textContent='';return}el.hidden=false;el.textContent=msg}
function setStatus(msg){if($('status'))$('status').textContent=msg||''}
function setBusy(on){const b=$('rf');if(b){b.disabled=!!on;b.textContent=on?'Refreshing…':'Refresh forecast'}}
async function refresh(forceLive){
  setBusy(true);
  try{
    const live=await fetchLive();
    writeStore(live);
    render(live);
    setErr('');
    setStatus('');
  }catch(e){
    setErr('Live forecast UNAVAILABLE. '+((e&&e.message)||'No values were invented.'));
  }finally{setBusy(false)}
}
async function boot(){
  const file=await loadFile();
  const store=readStore();
  const cached=newer(file,store);
  if(cached&&hasAreaData((cached.areas||{}).galoc)){
    render(cached);
    setStatus(isFresh(cached.at,Date.now())?'Showing the saved 7-day plan.':'Saved plan is older than 12 hours. Checking for a live forecast…');
  }
  if(forceLiveNeeded(cached)){
    try{
      const live=await fetchLive();
      writeStore(live);
      render(live);
      setErr('');
      setStatus('');
    }catch(e){
      if(!(cached&&hasAreaData((cached.areas||{}).galoc))){
        setErr('Forecast UNAVAILABLE. No values were invented.');
        $('sum').innerHTML='<p>Forecast UNAVAILABLE.</p>';
      }else{
        setErr('Live forecast UNAVAILABLE; showing the last saved plan. No values were invented.');
        setStatus('');
      }
    }
  }else setStatus('');
}
function forceLiveNeeded(cached){return !cached||!hasAreaData((cached.areas||{}).galoc)||!isFresh(cached.at,Date.now())}
if($('print'))$('print').onclick=()=>window.print();
if($('rf'))$('rf').onclick=()=>refresh(true);
/* boot */
boot();
</script>
